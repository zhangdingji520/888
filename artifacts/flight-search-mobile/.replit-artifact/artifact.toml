kind = "mobile"
previewPath = "/mobile/"
title = "SkySearch Mobile"
version = "1.0.0"
id = "artifacts/flight-search-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 19220

[services.development]
run = "pnpm --filter @workspace/flight-search-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flight-search-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/flight-search-mobile", "run", "serve" ]

[services.env]
PORT = "19220"
BASE_PATH = "/mobile/"
